<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Data Extractor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--primary:#2563eb;--bg:#f8fafc;--border:#e2e8f0;--green:#059669}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);padding:2rem;margin:0;color:#1e293b}
.container{max-width:1400px;margin:0 auto;background:#fff;padding:2rem;border-radius:12px;box-shadow:0 4px 6px -1px rgb(0 0 0/.1)}
h1{margin-top:0;color:#0f172a;font-size:1.6rem}
.upload-area{border:2px dashed var(--border);padding:2rem;text-align:center;border-radius:8px;margin-bottom:2rem;transition:border-color .2s}
.upload-area:hover,.upload-area.drag-over{border-color:var(--primary);background:#eff6ff}
input[type=file]{display:none}
.btn{color:#fff;padding:.55rem 1.1rem;border-radius:6px;cursor:pointer;border:none;font-weight:500;display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem}
.btn-primary{background:var(--primary)}.btn-green{background:var(--green)}.btn-gray{background:#475569}
.sheet-tabs{display:flex;margin-bottom:1.5rem;border-bottom:2px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
.sheet-tab{padding:.6rem 1.2rem;cursor:pointer;border:none;background:none;font-size:.9rem;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.sheet-tab:hover{color:var(--primary);background:#f1f5f9}
.sheet-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.5rem;padding:1rem;background:#f1f5f9;border-radius:8px}
.filter-group{display:flex;flex-direction:column;gap:.4rem;min-width:0}
.filter-group label{font-size:.8rem;font-weight:500;color:#475569}
input[type=text],input[type=number],select{padding:.5rem;border:1px solid var(--border);border-radius:4px;font-size:.85rem;width:100%;min-width:0}
.column-toggles{display:flex;flex-wrap:wrap;gap:.5rem;padding:.5rem;background:#fff;border:1px solid var(--border);border-radius:4px;max-height:100px;overflow-y:auto}
.column-toggle-item{display:flex;align-items:center;gap:.3rem}
.column-toggle-item label{cursor:pointer;font-size:.8rem;white-space:nowrap}
.table-container{overflow:auto;border:1px solid var(--border);border-radius:8px;max-height:600px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{background:#f8fafc;text-align:left;padding:.65rem;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:2;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{background:#e2e8f0}
.sort-icon{margin-left:6px;font-size:.75em}
td{padding:.55rem .65rem;border-bottom:1px solid var(--border);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
tr:hover{background:#f8fafc}
a.cell-link{color:var(--primary);font-weight:500;text-decoration:none}
a.cell-link:hover{text-decoration:underline}
.status{margin-top:.5rem;font-size:.85rem;color:#64748b}
.processed-time{margin-top:.25rem;font-size:.8rem;color:#94a3b8}
.progress-bar{width:100%;height:5px;background:var(--border);border-radius:3px;margin-top:.5rem;display:none}
.progress-bar-fill{height:100%;background:var(--primary);border-radius:3px;transition:width .3s;width:0}
.toolbar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem}
.toolbar .spacer{flex:1}
.pagination{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.pagination button{padding:.35rem .7rem;border:1px solid var(--border);background:#fff;border-radius:4px;cursor:pointer;font-size:.8rem}
.pagination button:disabled{opacity:.35;cursor:default}
.pagination select{padding:.35rem;font-size:.8rem;width:auto}
.page-info{font-size:.8rem;color:#64748b}
.export-wrap{position:relative;display:inline-block}
.export-menu{display:none;position:absolute;top:100%;left:0;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgb(0 0 0/.12);z-index:100;min-width:200px;padding:.3rem 0;margin-top:4px}
.export-menu.open{display:block}
.export-menu button{display:block;width:100%;text-align:left;padding:.6rem 1rem;border:none;background:none;cursor:pointer;font-size:.85rem;color:#1e293b}
.export-menu button:hover{background:#f1f5f9}
.fmt-icon{display:inline-block;width:40px;font-weight:600;color:var(--primary)}
#filterToggle{display:none}

/* ---------- Mobile ---------- */
@media (max-width:700px){
  body{padding:.5rem}
  .container{padding:1rem;border-radius:8px}
  h1{font-size:1.25rem}
  .upload-area{padding:1.25rem 1rem;margin-bottom:1rem}
  .filters{grid-template-columns:1fr;padding:.75rem;gap:.75rem}
  .filters.collapsed{display:none}
  #filterToggle{display:inline-flex}
  input[type=text],input[type=number],select{font-size:16px} /* stops iOS zoom on focus */
  .toolbar{gap:.5rem}
  .toolbar .spacer{display:none}
  #rowCount{width:100%;order:3}
  .pagination{width:100%;order:4;justify-content:space-between}
  .pagination button{padding:.5rem .7rem}
  .table-container{max-height:65vh}
  td{max-width:200px;padding:.5rem}
  .export-menu{position:fixed;left:.5rem;right:.5rem;top:auto;bottom:.5rem;max-height:70vh;overflow-y:auto}
}
</style>
</head>
<body>
<div class="container">
  <h1>Data Extractor &amp; Filter</h1>

  <div class="upload-area" id="dropZone">
    <p style="margin:0 0 .5rem;font-size:1.1rem;font-weight:500">Drop Excel, CSV, or PDF here</p>
    <label class="btn btn-primary">Browse Files<input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.pdf"></label>
    <div class="status" id="statusText">No file uploaded</div>
    <div class="processed-time" id="processedTime"></div>
    <div class="progress-bar" id="progressBar"><div class="progress-bar-fill" id="progressFill"></div></div>
  </div>

  <div id="appContent" style="display:none">
    <div class="sheet-tabs" id="sheetTabs"></div>

    <button class="btn btn-gray" id="filterToggle" style="margin-bottom:.75rem">&#9776; Filters</button>
    <div class="filters" id="filtersBox">
      <div class="filter-group">
        <label>Keyword Search</label>
        <input type="text" id="globalSearch" placeholder="Search all columns...">
      </div>
      <div id="columnFilters" style="display:contents"></div>
      <div class="filter-group">
        <label>Range Filter (Min – Max)</label>
        <div style="display:flex;gap:.5rem">
          <input type="number" id="rangeMin" placeholder="Min">
          <input type="number" id="rangeMax" placeholder="Max">
        </div>
        <select id="rangeColumn" style="margin-top:.3rem"><option value="">Select Numeric Column</option></select>
      </div>
      <div class="filter-group" style="grid-column:1/-1">
        <label>Show / Hide Columns</label>
        <div class="column-toggles" id="columnToggles"></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="export-wrap">
        <button class="btn btn-green" id="exportToggleBtn">&#11015; Export &#9662;</button>
        <div class="export-menu" id="exportMenu">
          <button onclick="exportData('csv')"><span class="fmt-icon">CSV</span> Comma-Separated</button>
          <button onclick="exportData('xlsx')"><span class="fmt-icon">XLSX</span> Excel Workbook</button>
          <button onclick="exportData('json')"><span class="fmt-icon">JSON</span> JSON Array</button>
          <button onclick="exportData('tsv')"><span class="fmt-icon">TSV</span> Tab-Separated</button>
          <button onclick="exportData('pdf')"><span class="fmt-icon">PDF</span> PDF Document</button>
          <button onclick="exportData('html')"><span class="fmt-icon">HTML</span> HTML Table</button>
          <button onclick="exportData('xml')"><span class="fmt-icon">XML</span> XML Data</button>
          <button onclick="exportData('sql')"><span class="fmt-icon">SQL</span> SQL INSERT</button>
        </div>
      </div>
      <span id="rowCount" class="page-info"></span>
      <span class="spacer"></span>
      <div class="pagination">
        <button id="firstPageBtn">&#171;</button>
        <button id="prevPageBtn">&#8249; Prev</button>
        <span class="page-info" id="pageInfo">Page 1</span>
        <button id="nextPageBtn">Next &#8250;</button>
        <button id="lastPageBtn">&#187;</button>
        <select id="pageSizeSelect" title="Rows per page">
          <option value="100">100</option><option value="250">250</option>
          <option value="500" selected>500</option><option value="1000">1,000</option><option value="5000">5,000</option>
        </select>
      </div>
    </div>

    <div class="table-container"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

/* ── State ── */
let sheets={},sheetNames=[],activeSheet='',sortCol=null,sortAsc=true,currentPage=1,pageSize=500;
const cellLinks=new WeakMap(); // row object -> { columnName: url }

/* ── DOM / helpers ── */
const $=id=>document.getElementById(id);
const fileInput=$('fileInput'),statusText=$('statusText'),tableHead=$('tableHead'),tableBody=$('tableBody'),
 appContent=$('appContent'),globalSearch=$('globalSearch'),columnFiltersBox=$('columnFilters'),rangeColumn=$('rangeColumn'),
 rangeMin=$('rangeMin'),rangeMax=$('rangeMax'),sheetTabs=$('sheetTabs'),progressBar=$('progressBar'),
 progressFill=$('progressFill'),processedTime=$('processedTime');
const escHtml=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const cur=()=>sheets[activeSheet];
const formatTimestamp=d=>d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'2-digit'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'});

/* ── Link helpers ── */
function safeUrl(u){try{const x=new URL(u);return['http:','https:','mailto:','tel:'].includes(x.protocol)?x.href:null}catch{return null}}
function getLink(row,h){const m=cellLinks.get(row);return m?m[h]:null}
function exportVal(row,h){return getLink(row,h)||(row[h]??'')}

/* ── File handling ── */
fileInput.onchange=e=>{if(e.target.files[0])processFile(e.target.files[0])};
const dropZone=$('dropZone');
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('drag-over')});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('drag-over');if(e.dataTransfer.files.length)processFile(e.dataTransfer.files[0])});

async function processFile(file){
  statusText.innerText=`Processing ${file.name}...`;processedTime.innerText='';
  progressBar.style.display='block';progressFill.style.width='10%';
  const ext=file.name.split('.').pop().toLowerCase();
  try{
    sheets={};sheetNames=[];
    if(ext==='pdf')await processPDF(file);else await processExcel(file);
    progressFill.style.width='70%';
    activeSheet=sheetNames[0];sortCol=null;sortAsc=true;currentPage=1;
    buildSheetTabs();setupUI();applyFilters();
    progressFill.style.width='100%';
    processedTime.innerText=`Processed on ${formatTimestamp(new Date())}`;
    setTimeout(()=>progressBar.style.display='none',400);
  }catch(err){
    console.error(err);statusText.innerText='Error processing file.';processedTime.innerText='';progressBar.style.display='none';
  }
}

function processExcel(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject('Read failed');
    reader.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        wb.SheetNames.forEach(name=>{
          const ws=wb.Sheets[name];
          // raw:false → cells come through formatted (dates/times readable)
          const json=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
          if(json.length>0){
            const h=Object.keys(json[0]);
            const range=XLSX.utils.decode_range(ws['!ref']);
            // Capture real hyperlinks stored on cells (cell.l.Target)
            json.forEach(row=>{
              const r=row.__rowNum__;
              h.forEach((col,i)=>{
                const cell=ws[XLSX.utils.encode_cell({r,c:range.s.c+i})];
                if(cell&&cell.l&&cell.l.Target){
                  const url=safeUrl(cell.l.Target);
                  if(url){let m=cellLinks.get(row);if(!m)cellLinks.set(row,m={});m[col]=url}
                }
              });
            });
            sheets[name]={headers:h,originalData:json,filteredData:json.slice()};
            sheetNames.push(name);
          }
        });
        sheetNames.length?resolve():reject('No data found');
      }catch(err){reject(err)}
    };
    reader.readAsArrayBuffer(file);
  });
}

async function processPDF(file){
  const pdf=await pdfjsLib.getDocument(await file.arrayBuffer()).promise;let rows=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i),content=await page.getTextContent(),lines={};
    content.items.forEach(it=>{const y=Math.round(it.transform[5]);(lines[y]=lines[y]||[]).push(it)});
    Object.keys(lines).sort((a,b)=>b-a).forEach(y=>{
      const r=lines[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(it=>it.str.trim()).filter(Boolean);
      if(r.length)rows.push(r);
    });
  }
  if(!rows.length)throw 'Empty PDF';
  const mc=Math.max(...rows.map(r=>r.length)),h=Array.from({length:mc},(_,i)=>`Col ${i+1}`);
  const data=rows.map(r=>{const o={};h.forEach((c,i)=>o[c]=r[i]||'');return o});
  sheets['PDF Data']={headers:h,originalData:data,filteredData:data.slice()};sheetNames.push('PDF Data');
}

/* ── Sheet tabs ── */
function buildSheetTabs(){
  sheetTabs.innerHTML='';
  sheetNames.forEach(name=>{
    const btn=document.createElement('button');
    btn.className='sheet-tab'+(name===activeSheet?' active':'');btn.innerText=name;
    btn.onclick=()=>{activeSheet=name;sortCol=null;sortAsc=true;currentPage=1;buildSheetTabs();setupUI();applyFilters()};
    sheetTabs.appendChild(btn);
  });
}

/* ── UI setup ── */
function setupUI(){
  appContent.style.display='block';
  const s=cur();
  statusText.innerText=`File loaded — sheet "${activeSheet}" has ${s.originalData.length.toLocaleString()} rows, ${s.headers.length} columns.`;
  columnFiltersBox.innerHTML='';
  s.headers.forEach(h=>{
    const div=document.createElement('div');div.className='filter-group';
    const lbl=document.createElement('label');lbl.innerText=`Filter ${h}`;
    const inp=document.createElement('input');inp.type='text';inp.className='col-filter';inp.setAttribute('data-col',h);inp.placeholder='Search...';
    inp.addEventListener('input',instantFilter);
    div.appendChild(lbl);div.appendChild(inp);columnFiltersBox.appendChild(div);
  });
  rangeColumn.innerHTML='<option value="">Select Numeric Column</option>';
  s.headers.forEach(h=>{
    const num=s.originalData.some(row=>{
      if(row[h]==null||row[h]==='')return false;
      const c=String(row[h]).replace(/[^0-9.-]+/g,'');return c!==''&&!isNaN(parseFloat(c));
    });
    if(num){const o=document.createElement('option');o.value=h;o.innerText=h;rangeColumn.appendChild(o)}
  });
  const ct=$('columnToggles');ct.innerHTML='';
  s.headers.forEach((h,i)=>{
    const div=document.createElement('div');div.className='column-toggle-item';
    const cb=document.createElement('input');cb.type='checkbox';cb.id=`ct-${i}`;cb.checked=true;cb.setAttribute('data-column',h);
    cb.addEventListener('change',renderTable);
    const lbl=document.createElement('label');lbl.htmlFor=cb.id;lbl.innerText=h;
    div.appendChild(cb);div.appendChild(lbl);ct.appendChild(div);
  });
  // On phones, start with filters collapsed so the table is visible first
  if(window.matchMedia('(max-width:700px)').matches)$('filtersBox').classList.add('collapsed');
}
$('filterToggle').onclick=()=>$('filtersBox').classList.toggle('collapsed');

/* ── Sort / filter ── */
function handleSort(col){if(sortCol===col)sortAsc=!sortAsc;else{sortCol=col;sortAsc=true}currentPage=1;applyFilters()}
function instantFilter(){currentPage=1;applyFilters()}
const normWs=v=>String(v).replace(/\s+/g,' ').trim().toLowerCase();

function applyFilters(){
  const s=cur(),gv=normWs(globalSearch.value),rcv=rangeColumn.value,mn=parseFloat(rangeMin.value),mx=parseFloat(rangeMax.value);
  const cf={};
  document.querySelectorAll('.col-filter').forEach(inp=>{if(inp.value)cf[inp.getAttribute('data-col')]=normWs(inp.value)});
  const cfk=Object.keys(cf),hasG=gv.length>0,hasR=rcv&&(!isNaN(mn)||!isNaN(mx)),hdrs=s.headers;
  s.filteredData=s.originalData.filter(row=>{
    if(hasG){let m=false;for(let i=0;i<hdrs.length;i++){const v=row[hdrs[i]];if(v!=null&&normWs(v).includes(gv)){m=true;break}}if(!m)return false}
    if(cfk.length){for(let i=0;i<cfk.length;i++){const k=cfk[i],cv=row[k];if(cv==null||!normWs(cv).includes(cf[k]))return false}}
    if(hasR){const rv=row[rcv]!=null?String(row[rcv]):'',v=parseFloat(rv.replace(/[^0-9.-]+/g,''));if(isNaN(v))return false;if(!isNaN(mn)&&v<mn)return false;if(!isNaN(mx)&&v>mx)return false}
    return true;
  });
  if(sortCol){
    const numRe=/^[$€£₹]?\s*-?[\d,]+(\.\d+)?$/;
    s.filteredData.sort((a,b)=>{
      let sa=String(a[sortCol]??'').trim(),sb=String(b[sortCol]??'').trim();
      if(numRe.test(sa)&&numRe.test(sb)){const na=parseFloat(sa.replace(/[^0-9.-]+/g,'')),nb=parseFloat(sb.replace(/[^0-9.-]+/g,''));return sortAsc?na-nb:nb-na}
      const c=sa.localeCompare(sb,undefined,{numeric:true,sensitivity:'base'});return sortAsc?c:-c;
    });
  }
  renderTable();
}

/* ── Pagination ── */
const totalPages=()=>Math.max(1,Math.ceil(cur().filteredData.length/pageSize));
function pageData(){const st=(currentPage-1)*pageSize;return cur().filteredData.slice(st,st+pageSize)}
function updatePag(){
  const tp=totalPages();$('pageInfo').innerText=`${currentPage} / ${tp}`;
  $('firstPageBtn').disabled=$('prevPageBtn').disabled=currentPage<=1;
  $('nextPageBtn').disabled=$('lastPageBtn').disabled=currentPage>=tp;
}
$('firstPageBtn').onclick=()=>{currentPage=1;renderTable()};
$('prevPageBtn').onclick=()=>{currentPage=Math.max(1,currentPage-1);renderTable()};
$('nextPageBtn').onclick=()=>{currentPage=Math.min(totalPages(),currentPage+1);renderTable()};
$('lastPageBtn').onclick=()=>{currentPage=totalPages();renderTable()};
$('pageSizeSelect').onchange=e=>{pageSize=parseInt(e.target.value);currentPage=1;renderTable()};

/* ── Render table (links are clickable here) ── */
function renderTable(){
  const s=cur(),vis={};
  document.querySelectorAll('#columnToggles input[type=checkbox]').forEach(cb=>vis[cb.getAttribute('data-column')]=cb.checked);
  const hdrs=s.headers;
  let hh='<tr>';
  for(let i=0;i<hdrs.length;i++){
    const h=hdrs[i],hid=vis[h]===false?'display:none;':'';
    let arrow='↕',ac='#cbd5e1';if(sortCol===h){arrow=sortAsc?'▲':'▼';ac='var(--primary)'}
    hh+=`<th style="${hid}" onclick="handleSort(this.getAttribute('data-col'))" data-col="${escHtml(h)}"><div style="display:flex;align-items:center;justify-content:space-between">${escHtml(h)} <span class="sort-icon" style="color:${ac}">${arrow}</span></div></th>`;
  }
  tableHead.innerHTML=hh+'</tr>';

  const pd=pageData(),parts=[];
  for(let i=0;i<pd.length;i+=500){
    let c='';
    for(let r=i;r<Math.min(i+500,pd.length);r++){
      const row=pd[r];c+='<tr>';
      for(let j=0;j<hdrs.length;j++){
        const h=hdrs[j],hid=vis[h]===false?'display:none;':'',val=row[h]!=null?row[h]:'';
        const url=getLink(row,h)||(/^https?:\/\//i.test(String(val))?safeUrl(String(val)):null);
        const inner=url?`<a class="cell-link" href="${escHtml(url)}" target="_blank" rel="noopener noreferrer">${escHtml(val)} ↗</a>`:escHtml(val);
        c+=`<td style="${hid}" title="${escHtml(url||val)}">${inner}</td>`;
      }
      c+='</tr>';
    }
    parts.push(c);
  }
  tableBody.innerHTML=parts.join('');
  $('rowCount').innerText=`Showing ${pd.length.toLocaleString()} of ${s.filteredData.length.toLocaleString()} filtered (${s.originalData.length.toLocaleString()} total)`;
  updatePag();
}

/* ── Export ── */
$('exportToggleBtn').onclick=()=>$('exportMenu').classList.toggle('open');
document.addEventListener('click',e=>{if(!e.target.closest('.export-wrap'))$('exportMenu').classList.remove('open')});

function getExportData(){
  const s=cur(),vis={};
  document.querySelectorAll('#columnToggles input[type=checkbox]').forEach(cb=>vis[cb.getAttribute('data-column')]=cb.checked);
  return{headers:s.headers.filter(h=>vis[h]!==false),data:s.filteredData};
}
function downloadBlob(blob,filename){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.style.display='none';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

function exportData(fmt){
  $('exportMenu').classList.remove('open');
  const{headers:vh,data}=getExportData();
  if(!data.length)return alert('No data to export');
  const base=`export_${activeSheet.replace(/[^a-zA-Z0-9]/g,'_')}`;
  switch(fmt){
    case 'csv':{
      const lines=[vh.map(h=>`"${h.replace(/"/g,'""')}"`).join(',')];
      data.forEach(row=>lines.push(vh.map(h=>`"${String(exportVal(row,h)).replace(/"/g,'""')}"`).join(',')));
      downloadBlob(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8;'}),base+'.csv');break}
    case 'tsv':{
      const lines=[vh.join('\t')];
      data.forEach(row=>lines.push(vh.map(h=>String(exportVal(row,h)).replace(/[\t\r\n]+/g,' ')).join('\t')));
      downloadBlob(new Blob([lines.join('\n')],{type:'text/tab-separated-values;charset=utf-8;'}),base+'.tsv');break}
    case 'json':{
      const out=data.map(row=>{const o={};vh.forEach(h=>o[h]=exportVal(row,h));return o});
      downloadBlob(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),base+'.json');break}
    case 'xlsx':{
      const ws=XLSX.utils.json_to_sheet(data.map(row=>{const o={};vh.forEach(h=>o[h]=exportVal(row,h));return o}),{header:vh});
      const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,activeSheet.substring(0,31));
      XLSX.writeFile(wb,base+'.xlsx');break}
    case 'pdf':{
      const{jsPDF}=window.jspdf;
      const doc=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
      doc.autoTable({
        head:[vh],
        body:data.map(row=>vh.map(h=>String(row[h]??''))), // long URLs stay out of the PDF text…
        styles:{fontSize:7,cellPadding:3},headStyles:{fillColor:[37,99,235],fontStyle:'bold'},
        alternateRowStyles:{fillColor:[248,250,252]},margin:{top:40},
        didDrawCell:d=>{ // …but link cells stay clickable
          if(d.section==='body'){
            const url=getLink(data[d.row.index],vh[d.column.index]);
            if(url)doc.link(d.cell.x,d.cell.y,d.cell.width,d.cell.height,{url});
          }
        }
      });
      doc.save(base+'.pdf');break}
    case 'html':{
      let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${escHtml(activeSheet)}</title><style>.w{overflow-x:auto}table{border-collapse:collapse;font-family:sans-serif;font-size:13px;width:100%}th{background:#2563eb;color:#fff;padding:8px;text-align:left;border:1px solid #ddd}td{padding:6px 8px;border:1px solid #ddd}tr:nth-child(even){background:#f8fafc}</style></head><body><h2>${escHtml(activeSheet)}</h2><div class="w"><table><thead><tr>`;
      vh.forEach(h=>html+=`<th>${escHtml(h)}</th>`);html+='</tr></thead><tbody>';
      data.forEach(row=>{html+='<tr>';vh.forEach(h=>{const u=getLink(row,h);html+=u?`<td><a href="${escHtml(u)}" target="_blank" rel="noopener noreferrer">${escHtml(row[h]??'')}</a></td>`:`<td>${escHtml(row[h]??'')}</td>`});html+='</tr>'});
      html+='</tbody></table></div></body></html>';
      downloadBlob(new Blob([html],{type:'text/html'}),base+'.html');break}
    case 'xml':{
      let xml='<?xml version="1.0" encoding="UTF-8"?>\n<dataset>\n';
      const safeTag=t=>t.replace(/[^a-zA-Z0-9_]/g,'_').replace(/^(\d)/,'_$1');
      data.forEach(row=>{xml+='  <row>\n';vh.forEach(h=>xml+=`    <${safeTag(h)}>${escHtml(exportVal(row,h))}</${safeTag(h)}>\n`);xml+='  </row>\n'});
      xml+='</dataset>';downloadBlob(new Blob([xml],{type:'application/xml'}),base+'.xml');break}
    case 'sql':{
      const safeCol=t=>'`'+t.replace(/`/g,'``')+'`';
      const safeVal=v=>{const s=String(v??'');return isNaN(v)||s.trim()===''?`'${s.replace(/'/g,"''")}'`:s};
      const tbl=safeCol(activeSheet.replace(/[^a-zA-Z0-9_]/g,'_'));
      let sql=`-- INSERT statements for table ${activeSheet}\nCREATE TABLE IF NOT EXISTS ${tbl} (${vh.map(h=>`${safeCol(h)} TEXT`).join(', ')});\n\n`;
      data.forEach(row=>sql+=`INSERT INTO ${tbl} (${vh.map(safeCol).join(', ')}) VALUES (${vh.map(h=>safeVal(exportVal(row,h))).join(', ')});\n`);
      downloadBlob(new Blob([sql],{type:'application/sql'}),base+'.sql');break}
  }
}

/* ── Global listeners ── */
globalSearch.addEventListener('input',instantFilter);
rangeMin.addEventListener('input',instantFilter);
rangeMax.addEventListener('input',instantFilter);
rangeColumn.addEventListener('change',()=>{currentPage=1;applyFilters()});
</script>
